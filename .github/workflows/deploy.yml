name: Deploy to server

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

env:
  DEPLOY_PORT: 22
  DEPLOY_PATH: /root/workspace/backup/spices-ecommerce

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
        run: |
          set -euo pipefail

          : "${VPS_HOST:?VPS_HOST secret is required}"

          install -m 700 -d ~/.ssh
          ssh-keyscan -T 10 -p "$DEPLOY_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          if [ -n "${VPS_SSH_KEY:-}" ]; then
            printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
            echo "DEPLOY_AUTH_METHOD=ssh_key" >> "$GITHUB_ENV"
          elif [ -n "${VPS_PASSWORD:-}" ]; then
            echo "::add-mask::$VPS_PASSWORD"
            sudo apt-get update
            sudo apt-get install -y sshpass
            echo "DEPLOY_AUTH_METHOD=password" >> "$GITHUB_ENV"
          else
            echo "Either VPS_SSH_KEY or VPS_PASSWORD secret is required." >&2
            exit 1
          fi

      - name: Pull latest code and restart Docker Compose
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
        run: |
          set -euo pipefail

          : "${VPS_HOST:?VPS_HOST secret is required}"
          : "${VPS_USER:?VPS_USER secret is required}"
          : "${DEPLOY_AUTH_METHOD:?DEPLOY_AUTH_METHOD is required}"

          if [ "$DEPLOY_AUTH_METHOD" = "ssh_key" ]; then
            SSH_COMMAND=(ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -p "$DEPLOY_PORT")
          else
            : "${VPS_PASSWORD:?VPS_PASSWORD secret is required when VPS_SSH_KEY is not set}"
            export SSHPASS="$VPS_PASSWORD"
            SSH_COMMAND=(sshpass -e ssh -o StrictHostKeyChecking=yes -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -p "$DEPLOY_PORT")
          fi

          "${SSH_COMMAND[@]}" "$VPS_USER@$VPS_HOST" "DEPLOY_PATH='$DEPLOY_PATH' bash -se" <<'REMOTE_SCRIPT'
          set -euo pipefail

          cd "$DEPLOY_PATH"

          git fetch origin main
          git checkout main
          git pull --ff-only origin main

          if docker compose version >/dev/null 2>&1; then
            COMPOSE="docker compose"
          elif command -v docker-compose >/dev/null 2>&1; then
            COMPOSE="docker-compose"
          else
            echo "Docker Compose is not installed on the server." >&2
            exit 1
          fi

          $COMPOSE up -d --build --remove-orphans
          docker image prune -f
          REMOTE_SCRIPT
